<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Live Таблица</title>
<style>
  body { margin: 0; background: transparent; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 10px; }
  h1 { color: #ff9900; text-align: center; margin: 0 0 15px; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
  
  table { width: 100%; border-collapse: collapse; background: rgba(30, 30, 30, 0.9); border-radius: 8px; overflow: hidden; }
  th { background: #ff9900; color: #000; padding: 12px; text-transform: uppercase; font-size: 14px; font-weight: bold; }
  td { padding: 12px; border-bottom: 1px solid #333; vertical-align: middle; color: #fff; }
  
  .rank { font-size: 24px; font-weight: bold; text-align: center; width: 60px; }
  .top-1 { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
  .top-2 { color: #C0C0C0; }
  .top-3 { color: #CD7F32; }
  
  .nick { font-size: 18px; font-weight: bold; color: #ff9900; }
  .total-dmg { font-size: 22px; font-weight: bold; text-align: right; color: #fff; }
  .battle-cell { font-size: 13px; text-align: center; }
  .map-name { color: #aaa; display: block; margin-bottom: 2px; }
  .dmg-val { color: #fff; font-weight: bold; font-size: 15px; }
  
  .current-player { 
    background: rgba(255, 153, 0, 0.2) !important; 
    border-left: 4px solid #ff9900;
    animation: pulse-border 2s infinite;
  }
  .current-player .nick { color: #fff; text-shadow: 0 0 8px #ff9900; }
  .current-player .total-dmg { color: #ff9900; }
  
  @keyframes pulse-border {
    0% { box-shadow: inset 0 0 0 0 rgba(255, 153, 0, 0); }
    50% { box-shadow: inset 0 0 20px 0 rgba(255, 153, 0, 0.3); }
    100% { box-shadow: inset 0 0 0 0 rgba(255, 153, 0, 0); }
  }
  
  .you-are-here { 
    margin-top: 10px; padding: 15px; 
    background: rgba(255, 153, 0, 0.15); 
    border: 2px dashed #ff9900; border-radius: 8px;
    display: none; align-items: center; justify-content: space-between; 
  }
  .you-are-here.active { display: flex; }
  .rank-badge { 
    background: #ff9900; color: #000; padding: 5px 15px; 
    border-radius: 20px; font-weight: bold; font-size: 18px; 
  }
</style>
</head>
<body>
<div class="container">
  <h1>🏆 Ты самый сильный</h1>
  <table id="leaderboardTable">
    <thead>
      <tr>
        <th>#</th><th>Игрок</th><th>Сумм. урон</th>
        <th>Бой 1</th><th>Бой 2</th><th>Бой 3</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody"></tbody>
  </table>
  
  <div id="youAreHere" class="you-are-here">
    <div class="info">
      <span style="color:#aaa">Ваше место:</span> 
      <span id="yourRankText" style="font-weight:bold; color:#fff; font-size:20px;"></span>
    </div>
    <div class="rank-badge" id="yourRankBadge"></div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx8uzWeYRbS94RMs2UTryOXYEAkiAmsK-uOjHJC0lklUK2KUrQx_2Ezpn3Shwqx4kXu/exec";
  
  function getPlayerFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('player');
  }

  function renderLeaderboard(data) {
    const currentPlayer = getPlayerFromUrl();
    const tbody = document.getElementById('leaderboardBody');
    const youAreHereDiv = document.getElementById('youAreHere');
    let html = '';
    let foundInTop = false;

    data.leaderboard.forEach((p, i) => {
      const isCurrent = currentPlayer && p.nickname.toLowerCase() === currentPlayer.toLowerCase();
      if (isCurrent && i < 10) foundInTop = true;
      
      const rankClass = i < 3 ? `top-${i+1}` : '';
      const rowClass = isCurrent ? 'current-player' : '';
      const b1 = p.battles[0] || {}, b2 = p.battles[1] || {}, b3 = p.battles[2] || {};

      html += `<tr class="${rowClass}">
        <td class="rank ${rankClass}">${i + 1}</td>
        <td class="nick">${p.nickname} ${isCurrent ? '👈' : ''}</td>
        <td class="total-dmg">${p.totalDamage}</td>
        <td class="battle-cell"><span class="map-name">${b1.map || '-'}</span><span class="dmg-val">${b1.damage || 0}</span></td>
        <td class="battle-cell"><span class="map-name">${b2.map || '-'}</span><span class="dmg-val">${b2.damage || 0}</span></td>
        <td class="battle-cell"><span class="map-name">${b3.map || '-'}</span><span class="dmg-val">${b3.damage || 0}</span></td>
      </tr>`;
    });

    tbody.innerHTML = html || '<tr><td colspan="6" style="text-align:center;padding:20px;">Ожидание участников...</td></tr>';

    if (currentPlayer && !foundInTop) {
      const playerData = data.leaderboard.find(p => p.nickname.toLowerCase() === currentPlayer.toLowerCase());
      if (playerData) {
        const realRank = data.leaderboard.indexOf(playerData) + 1;
        document.getElementById('yourRankText').innerText = `${realRank} место`;
        document.getElementById('yourRankBadge').innerText = `#${realRank}`;
        youAreHereDiv.classList.add('active');
      } else {
        youAreHereDiv.classList.remove('active');
      }
    } else {
      youAreHereDiv.classList.remove('active');
    }
  }

  function loadData() {
    fetch(API_URL)
      .then(r => r.json())
      .then(renderLeaderboard)
      .catch(e => console.error('Ошибка загрузки:', e));
  }

  loadData();
  setInterval(loadData, 10000);
</script>
</body>
</html>
